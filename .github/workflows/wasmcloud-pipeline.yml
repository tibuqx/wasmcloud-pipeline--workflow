name: wasmCloud CI/CD Pipeline

# Reusable GitHub Actions CI/CD workflow orchestrating ADR-0046 compliant 3-stage
# environment promotion (integration, staging, production) for wasmCloud applications.
#
# Promotion Lifecycle:
# 1. Integration on Pull Request:
#    - Automated CI baseline verification (formatting, SDD engine purity, WASM check, unit tests, live DB integration tests).
#    - On pass, builds WASM artifacts and deploys to the 'integration' environment lattice.
# 2. Staging on Merge to main:
#    - Compiles release WASM components, publishes OCI packages to GHCR, and deploys to 'staging' lattice.
# 3. Production Gated via Manual Gate:
#    - Strictly sequenced after staging (needs: [deploy-staging]).
#    - Bound to 'production' GitHub Actions Environment with manual approval protection rules.

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust toolchain version to install"
        required: false
        type: string
        default: "stable"
      wasm-target:
        description: "WASM compilation target architecture"
        required: false
        type: string
        default: "wasm32-wasip2"
      wash-version:
        description: "wasmCloud wash CLI version tag to install"
        required: false
        type: string
        default: "wash-v0.43.0"
      enable-sdd-check:
        description: "Enable SDD contract and engine purity verification"
        required: false
        type: boolean
        default: true
      sdd-script-path:
        description: "Path to SDD validation script"
        required: false
        type: string
        default: "scripts/validate_sdd.sh"
      database-compose-file:
        description: "Path to docker-compose file for live integration test database"
        required: false
        type: string
        default: ""
      database-service-name:
        description: 'Name of the database service in docker-compose to monitor for readiness'
        required: false
        type: string
        default: 'postgrest'
      database-network:
        description: "Docker network name for test database container bridge"
        required: false
        type: string
        default: "wasmcloud--infra_default"
      database-health-url:
        description: "Readiness probe URL for database / PostgREST bridge"
        required: false
        type: string
        default: "http://127.0.0.1:3001/"
      integration-test-command:
        description: "Custom cargo test command for integration tests"
        required: false
        type: string
        default: ""
      wadm-manifest-path:
        description: "Path to WADM OAM application deployment manifest"
        required: false
        type: string
        default: "deploy/wadm.yaml"
      oci-registry:
        description: "OCI container registry host for WASM components"
        required: false
        type: string
        default: "ghcr.io"
      oci-repository-prefix:
        description: "OCI repository namespace prefix (defaults to repository slug)"
        required: false
        type: string
        default: ""
      deploy-integration:
        description: "Whether to deploy to integration environment on PR"
        required: false
        type: boolean
        default: true
      deploy-staging:
        description: "Whether to deploy to staging environment on merge to main"
        required: false
        type: boolean
        default: true
      deploy-production:
        description: "Whether to deploy to production environment with approval"
        required: false
        type: boolean
        default: true
      integration-lattice:
        description: "wasmCloud lattice name for integration environment"
        required: false
        type: string
        default: "default"
      staging-lattice:
        description: "wasmCloud lattice name for staging environment"
        required: false
        type: string
        default: "default"
      production-lattice:
        description: "wasmCloud lattice name for production environment"
        required: false
        type: string
        default: "default"
      aws-role-arn:
        description: "AWS IAM Role ARN to assume via GitHub OIDC for remote ECS deployment"
        required: false
        type: string
        default: "arn:aws:iam::461415799326:role/github-actions-wasmcloud-prod"
      aws-region:
        description: "AWS region hosting wasmCloud ECS cluster"
        required: false
        type: string
        default: "eu-west-1"
      ecs-cluster:
        description: "AWS ECS cluster name hosting wasmCloud lattice"
        required: false
        type: string
        default: "wasmcloud-ecs-cluster"
      ecs-task-definition:
        description: "AWS ECS task definition family for ephemeral WADM deployer"
        required: false
        type: string
        default: "wasmcloud-wadm-deployer"
      ecs-subnets:
        description: "Comma-separated VPC subnets for ephemeral ECS task"
        required: false
        type: string
        default: "subnet-0889866a27a35d737,subnet-0f2152a18bd3051c3"
      ecs-security-groups:
        description: "Comma-separated security groups for ephemeral ECS task"
        required: false
        type: string
        default: "sg-07b7ae6447421b2b7"
      ecs-assign-public-ip:
        description: "Assign public IP to ephemeral ECS task (ENABLED or DISABLED)"
        required: false
        type: string
        default: "ENABLED"
      nats-host:
        description: "Private NATS control plane hostname within the VPC"
        required: false
        type: string
        default: "nats.wasmcloud.local"
      nats-port:
        description: "Private NATS control plane port"
        required: false
        type: string
        default: "4222"
      health-check-endpoint:
        description: "Default health check endpoint URL for deployed application"
        required: false
        type: string
        default: ""
      health-endpoint-integration:
        description: "Health check URL for integration environment"
        required: false
        type: string
        default: ""
      health-endpoint-staging:
        description: "Health check URL for staging environment"
        required: false
        type: string
        default: ""
      health-endpoint-production:
        description: "Health check URL for production environment"
        required: false
        type: string
        default: ""

    secrets:
      WASMCLOUD_CTL_HOST:
        description: "Target wasmCloud lattice NATS control host"
        required: false
      WASMCLOUD_CTL_PORT:
        description: "Target wasmCloud lattice NATS control port"
        required: false
      WASH_CTL_CREDS:
        description: "NATS user credentials or JWT file content"
        required: false
      OCI_REGISTRY_USER:
        description: "Username for OCI registry authentication"
        required: false
      OCI_REGISTRY_PASSWORD:
        description: "Password or token for OCI registry authentication"
        required: false
      RELEASE_TOKEN:
        description: "GitHub token with contents:write for release tagging"
        required: false

    outputs:
      image-tag:
        description: "OCI component image tag deployed during workflow run"
        value: ${{ jobs.package.outputs.image-tag }}
      integration-url:
        description: "Deployment health URL for integration environment"
        value: ${{ jobs.deploy-integration.outputs.url }}
      staging-url:
        description: "Deployment health URL for staging environment"
        value: ${{ jobs.deploy-staging.outputs.url }}
      production-url:
        description: "Deployment health URL for production environment"
        value: ${{ jobs.deploy-production.outputs.url }}

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. CI Baseline Verification Job
  # Runs on Pull Requests and direct pushes to main.
  # Enforces formatting, SDD purity, compilation, unit tests, and live DB tests.
  # =========================================================================
  ci-verify:
    name: CI Baseline Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: ${{ inputs.wasm-target }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ inputs.wasm-target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ inputs.wasm-target }}-

      - name: SDD Contract & Engine Purity Verification
        if: inputs.enable-sdd-check && hashFiles(inputs.sdd-script-path) != ''
        run: |
          echo "Executing SDD contract and engine purity verification..."
          bash "${{ inputs.sdd-script-path }}"

      - name: Code Formatting Check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Clippy Linting
        run: cargo clippy --workspace --target "${{ inputs.wasm-target }}" -- -D warnings

      - name: WASM Compilation Check
        run: cargo check --target "${{ inputs.wasm-target }}" --workspace

      - name: Unit & Mock Tests
        run: cargo test --workspace --lib

      - name: Live Database Integration Tests
        if: inputs.database-compose-file != '' && hashFiles(inputs.database-compose-file) != ''
        env:
          DB_COMPOSE: ${{ inputs.database-compose-file }}
          DB_SERVICE: ${{ inputs.database-service-name }}
          DB_NETWORK: ${{ inputs.database-network }}
          HEALTH_URL: ${{ inputs.database-health-url }}
          CUSTOM_CMD: ${{ inputs.integration-test-command }}
        run: |
          echo "Creating docker network ${DB_NETWORK}..."
          docker network create "${DB_NETWORK}" || true

          echo "Starting test database infrastructure with compose file ${DB_COMPOSE} (${DB_SERVICE})..."
          docker compose -f "${DB_COMPOSE}" up -d

          echo "Polling database readiness at ${HEALTH_URL}..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f "${HEALTH_URL}" > /dev/null 2>&1; then
              echo "Database service healthy after ${i} seconds."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database infrastructure failed readiness probe at ${HEALTH_URL} within 30s."
            docker compose -f "${DB_COMPOSE}" logs
            exit 1
          fi

          if [ -n "${CUSTOM_CMD}" ]; then
            echo "Executing custom integration test command: ${CUSTOM_CMD}"
            eval "${CUSTOM_CMD}"
          else
            echo "Executing default cargo test suite against live database..."
            REQUIRE_POSTGREST=true POSTGREST_URL="${HEALTH_URL}" cargo test --workspace --test '*' -- --nocapture
          fi

      - name: Teardown Live Database Infrastructure
        if: always() && inputs.database-compose-file != '' && hashFiles(inputs.database-compose-file) != ''
        run: |
          echo "Tearing down database test infrastructure..."
          docker compose -f "${{ inputs.database-compose-file }}" down -v || true

  # =========================================================================
  # 2. Package Job
  # Compiles release WASM components and publishes OCI artifacts to GHCR.
  # =========================================================================
  package:
    name: Package WASM Components & Push OCI
    runs-on: ubuntu-latest
    needs: [ci-verify]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: ${{ inputs.wasm-target }}

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ inputs.wasm-target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ inputs.wasm-target }}-

      - name: Build Release WebAssembly Components
        run: cargo build --target "${{ inputs.wasm-target }}" --release --workspace

      - name: Compute Artifact Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            TAG="sha-${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Computed artifact tag: ${TAG}"

      - name: Install wash CLI
        run: |
          echo "Installing wasmCloud wash CLI (${{ inputs.wash-version }})..."
          if ! command -v wash &> /dev/null; then
            WASH_VER="${{ inputs.wash-version }}"
            if sudo curl -fsSL "https://github.com/wasmCloud/wasmCloud/releases/download/${WASH_VER}/wash-x86_64-unknown-linux-musl" -o /usr/local/bin/wash; then
              sudo chmod +x /usr/local/bin/wash
            else
              echo "Fallback: installing via packagecloud..."
              curl -s https://packagecloud.io/install/repositories/wasmcloud/core/script.deb.sh | sudo bash || true
              sudo apt-get install -y wash || true
            fi
          fi
          wash --version

      - name: Configure AWS Credentials for ECR (OIDC)
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          audience: sts.amazonaws.com

      - name: Obtain ECR Credentials
        id: ecr-auth
        if: inputs.aws-role-arn != '' && contains(inputs.oci-registry, 'amazonaws.com')
        run: |
          echo "Obtaining AWS ECR login password..."
          ECR_PASS=$(aws ecr get-login-password --region "${{ inputs.aws-region }}")
          echo "::add-mask::${ECR_PASS}"
          echo "password=${ECR_PASS}" >> "${GITHUB_OUTPUT}"

      - name: Log in to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.oci-registry }}
          username: ${{ steps.ecr-auth.outputs.password != '' && 'AWS' || secrets.OCI_REGISTRY_USER || github.actor }}
          password: ${{ steps.ecr-auth.outputs.password || secrets.OCI_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Package & Push Components via wash push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ inputs.oci-registry }}
          PREFIX: ${{ inputs.oci-repository-prefix }}
          TARGET: ${{ inputs.wasm-target }}
          OCI_USER: ${{ steps.ecr-auth.outputs.password != '' && 'AWS' || secrets.OCI_REGISTRY_USER || github.actor }}
          OCI_PASSWORD: ${{ steps.ecr-auth.outputs.password || secrets.OCI_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          echo "Pushing WASM components to ${REGISTRY} with tag ${TAG}..."
          FOUND=0
          for wasm in target/"${TARGET}"/release/*.wasm; do
            [ -f "$wasm" ] || continue
            FOUND=1
            name=$(basename "$wasm" .wasm | tr '_' '-')
            if [ -n "${PREFIX}" ]; then
              DEST="${REGISTRY}/${PREFIX}/${name}:${TAG}"
            else
              DEST="${REGISTRY}/${name}:${TAG}"
            fi
            echo "Publishing ${wasm} -> ${DEST}"
            wash push "${DEST}" "${wasm}" \
              --user "${OCI_USER}" \
              --password "${OCI_PASSWORD}" \
              --allow-latest
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No .wasm binaries found in target/${TARGET}/release/ to push."
            exit 1
          fi

  # =========================================================================
  # 3. Deploy to Integration Environment (PR Preview)
  # Triggered exclusively on Pull Requests against main after CI passes.
  # =========================================================================
  deploy-integration:
    name: Deploy to Integration (PR Preview)
    runs-on: ubuntu-latest
    needs: [ci-verify, package]
    if: github.event_name == 'pull_request' && inputs.deploy-integration
    environment:
      name: integration
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: integration-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          audience: sts.amazonaws.com

      - name: Install wash CLI
        run: |
          echo "Installing wasmCloud wash CLI (${{ inputs.wash-version }})..."
          if ! command -v wash &> /dev/null; then
            WASH_VER="${{ inputs.wash-version }}"
            if sudo curl -fsSL "https://github.com/wasmCloud/wasmCloud/releases/download/${WASH_VER}/wash-x86_64-unknown-linux-musl" -o /usr/local/bin/wash; then
              sudo chmod +x /usr/local/bin/wash
            else
              echo "Fallback: installing via packagecloud..."
              curl -s https://packagecloud.io/install/repositories/wasmcloud/core/script.deb.sh | sudo bash || true
              sudo apt-get install -y wash || true
            fi
          fi
          wash --version

      - name: Interpolate WADM Application Manifest
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          TAG: ${{ needs.package.outputs.image-tag }}
          REGISTRY: ${{ inputs.oci-registry }}
          PREFIX: ${{ inputs.oci-repository-prefix }}
        run: |
          echo "Interpolating WADM manifest ${MANIFEST} with tag ${TAG}..."
          if [ -f "${MANIFEST}" ]; then
            sed -i "s|{{IMAGE_TAG}}|${TAG}|g" "${MANIFEST}"
            if [ -n "${PREFIX}" ]; then
              sed -i "s|{{REGISTRY}}|${REGISTRY}/${PREFIX}|g" "${MANIFEST}"
            else
              sed -i "s|{{REGISTRY}}|${REGISTRY}|g" "${MANIFEST}"
            fi
          else
            echo "WADM manifest ${MANIFEST} not found, skipping templating."
          fi

      - name: Validate WADM Application Manifest
        run: |
          if [ -f "${{ inputs.wadm-manifest-path }}" ]; then
            echo "Validating WADM application manifest ${{ inputs.wadm-manifest-path }}..."
            wash app validate "${{ inputs.wadm-manifest-path }}"
          fi

      - name: Sync Fresh ECR Token to Secrets Manager (Zero GHCR Policy, ADR-0042, ADR-0045)
        if: contains(inputs.oci-registry, 'amazonaws.com')
        run: |
          echo "Syncing fresh ECR authorization token for wasmcloud-host..."
          ECR_PASS=$(aws ecr get-login-password --region "${{ inputs.aws-region }}")
          aws secretsmanager put-secret-value \
            --secret-id "wasmcloud/ecr/token" \
            --secret-string "${ECR_PASS}" \
            --region "${{ inputs.aws-region }}"

      - name: Deploy to Integration wasmCloud Lattice (Remote in-VPC ECS Task)
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          LATTICE: ${{ inputs.integration-lattice }}
          CLUSTER: ${{ inputs.ecs-cluster }}
          TASK_DEF: ${{ inputs.ecs-task-definition }}
          SUBNETS: ${{ inputs.ecs-subnets }}
          SECURITY_GROUPS: ${{ inputs.ecs-security-groups }}
          ASSIGN_PUBLIC_IP: ${{ inputs.ecs-assign-public-ip }}
          INPUT_CTL_HOST: ${{ secrets.WASMCLOUD_CTL_HOST }}
          INPUT_CTL_PORT: ${{ secrets.WASMCLOUD_CTL_PORT }}
          INPUT_NATS_HOST: ${{ inputs.nats-host }}
          INPUT_NATS_PORT: ${{ inputs.nats-port }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail

          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: Manifest file '${MANIFEST}' not found. Cannot deploy to lattice."
            exit 1
          fi

          CTL_HOST="${INPUT_CTL_HOST:-${INPUT_NATS_HOST:-nats.wasmcloud.local}}"
          CTL_PORT="${INPUT_CTL_PORT:-${INPUT_NATS_PORT:-4222}}"
          TARGET_LATTICE="${LATTICE:-default}"

          echo "=== wasmCloud Remote in-VPC Deployment ==="
          echo "Target Manifest: ${MANIFEST}"
          echo "Target Lattice:  ${TARGET_LATTICE}"
          echo "NATS Control:    ${CTL_HOST}:${CTL_PORT}"
          echo "ECS Cluster:     ${CLUSTER}"
          echo "Task Definition: ${TASK_DEF}"
          echo "Subnets:         ${SUBNETS}"
          echo "Security Groups: ${SECURITY_GROUPS}"
          echo "Public IP:       ${ASSIGN_PUBLIC_IP}"

          # Compress manifest to base64 to ensure it stays well within ECS overrides character limit
          MANIFEST_GZ_B64=$(gzip -c "${MANIFEST}" | base64 -w 0)

          # Dynamically determine the container name from the task definition
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF}" \
            --region "${AWS_REGION}" \
            --query "taskDefinition.containerDefinitions[0].name" \
            --output text)

          if [ -z "${CONTAINER_NAME}" ] || [ "${CONTAINER_NAME}" = "None" ]; then
            echo "ERROR: Could not resolve container name from task definition '${TASK_DEF}'."
            exit 1
          fi
          echo "Target Container Name: ${CONTAINER_NAME}"

          # Build container overrides JSON
          CONTAINER_SCRIPT="set -euo pipefail; echo '=== In-VPC Ephemeral Deployer Started ==='; echo 'Decoding and decompressing manifest...'; echo \"\$MANIFEST_GZ_B64\" | base64 -d | gunzip > /tmp/wadm.yaml; echo 'Verifying wash CLI availability...'; if ! command -v wash >/dev/null 2>&1; then echo 'Installing curl, ca-certificates, and wash binary...'; apk add --no-cache curl ca-certificates >/dev/null 2>&1 || true; curl -fsSL 'https://github.com/wasmCloud/wasmCloud/releases/download/wash-v0.43.0/wash-aarch64-unknown-linux-musl' -o /usr/local/bin/wash; chmod +x /usr/local/bin/wash; fi; echo 'Executing wash app deploy...'; wash app deploy /tmp/wadm.yaml --ctl-host \"${CTL_HOST}\" --ctl-port \"${CTL_PORT}\" --lattice \"${TARGET_LATTICE}\" --replace; echo '=== WADM Application Deployment Successfully Executed ==='"

          OVERRIDES_FILE=$(mktemp)
          python3 -c 'import json, sys; overrides = {"containerOverrides": [{"name": sys.argv[1], "environment": [{"name": "MANIFEST_GZ_B64", "value": sys.argv[2]}], "command": ["sh", "-c", sys.argv[3]]}]}; json.dump(overrides, open(sys.argv[4], "w"))' "${CONTAINER_NAME}" "${MANIFEST_GZ_B64}" "${CONTAINER_SCRIPT}" "${OVERRIDES_FILE}"

          NET_CONFIG=$(python3 -c 'import json, sys; subnets = json.dumps([s.strip() for s in sys.argv[1].split(",") if s.strip()]); sgs = json.dumps([s.strip() for s in sys.argv[2].split(",") if s.strip()]); pip = sys.argv[3].strip(); print(f"awsvpcConfiguration={{subnets={subnets},securityGroups={sgs},assignPublicIp={pip}}}")' "${SUBNETS}" "${SECURITY_GROUPS}" "${ASSIGN_PUBLIC_IP}")

          echo "Launching ephemeral ECS Fargate deployment task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEF}" \
            --launch-type FARGATE \
            --network-configuration "${NET_CONFIG}" \
            --overrides "file://${OVERRIDES_FILE}" \
            --region "${AWS_REGION}" \
            --query "tasks[0].taskArn" \
            --output text)

          rm -f "${OVERRIDES_FILE}"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ERROR: Failed to launch ephemeral ECS deployment task. No task ARN returned."
            exit 1
          fi

          echo "Launched ephemeral ECS task: ${TASK_ARN}"
          TASK_ID=$(echo "${TASK_ARN}" | awk -F'/' '{print $NF}')

          echo "Waiting for ephemeral deployment task (${TASK_ID}) to stop..."
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}"

          echo "Task stopped. Inspecting task completion status..."
          DESC=$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}")

          EXIT_CODE=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].exitCode')
          STOP_REASON=$(echo "${DESC}" | jq -r '.tasks[0].stoppedReason // empty')
          CONTAINER_REASON=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].reason // empty')

          echo "Task stopped reason: ${STOP_REASON:-None}"
          echo "Container exit code: ${EXIT_CODE}"
          if [ -n "${CONTAINER_REASON}" ]; then
            echo "Container reason: ${CONTAINER_REASON}"
          fi

          # Fail closed if exit code is non-zero or empty
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "ERROR: Ephemeral deployment container exited with non-zero code: ${EXIT_CODE}"
            echo "=== Fetching CloudWatch logs for task ${TASK_ID} ==="
            LOG_GROUP="/ecs/cloudflared"
            LOG_STREAM="deployer/${CONTAINER_NAME}/${TASK_ID}"
            aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${LOG_STREAM}" \
              --region "${AWS_REGION}" \
              --query "events[*].message" \
              --output text || echo "Warning: Could not retrieve CloudWatch logs for ${LOG_STREAM}"
            exit 1
          fi

          echo "Ephemeral ECS deployment task completed successfully (exit code 0)."

      - name: Integration Availability Smoke Test
        id: smoke
        env:
          HEALTH_URL: ${{ inputs.health-endpoint-integration || inputs.health-check-endpoint }}
        run: |
          if [ -n "${HEALTH_URL}" ]; then
            echo "Verifying integration service health at ${HEALTH_URL}..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "${HEALTH_URL}" > /dev/null 2>&1; then
                echo "Integration service healthy after ${i} retries."
                SUCCESS=1
                break
              fi
              sleep 5
            done
            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Integration service failed health check at ${HEALTH_URL} within timeout."
              exit 1
            fi
            echo "url=${HEALTH_URL}" >> "${GITHUB_OUTPUT}"
          else
            echo "url=" >> "${GITHUB_OUTPUT}"
          fi

  # =========================================================================
  # 4. Deploy to Staging Environment
  # Automatically triggered upon merge to main branch after CI passes.
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ci-verify, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy-staging
    environment:
      name: staging
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: deploy-staging-main
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          audience: sts.amazonaws.com

      - name: Install wash CLI
        run: |
          echo "Installing wasmCloud wash CLI (${{ inputs.wash-version }})..."
          if ! command -v wash &> /dev/null; then
            WASH_VER="${{ inputs.wash-version }}"
            if sudo curl -fsSL "https://github.com/wasmCloud/wasmCloud/releases/download/${WASH_VER}/wash-x86_64-unknown-linux-musl" -o /usr/local/bin/wash; then
              sudo chmod +x /usr/local/bin/wash
            else
              echo "Fallback: installing via packagecloud..."
              curl -s https://packagecloud.io/install/repositories/wasmcloud/core/script.deb.sh | sudo bash || true
              sudo apt-get install -y wash || true
            fi
          fi
          wash --version

      - name: Interpolate WADM Application Manifest
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          TAG: ${{ needs.package.outputs.image-tag }}
          REGISTRY: ${{ inputs.oci-registry }}
          PREFIX: ${{ inputs.oci-repository-prefix }}
        run: |
          echo "Interpolating staging WADM manifest ${MANIFEST} with tag ${TAG}..."
          if [ -f "${MANIFEST}" ]; then
            sed -i "s|{{IMAGE_TAG}}|${TAG}|g" "${MANIFEST}"
            if [ -n "${PREFIX}" ]; then
              sed -i "s|{{REGISTRY}}|${REGISTRY}/${PREFIX}|g" "${MANIFEST}"
            else
              sed -i "s|{{REGISTRY}}|${REGISTRY}|g" "${MANIFEST}"
            fi
          else
            echo "WADM manifest ${MANIFEST} not found, skipping templating."
          fi

      - name: Validate WADM Application Manifest
        run: |
          if [ -f "${{ inputs.wadm-manifest-path }}" ]; then
            echo "Validating WADM application manifest ${{ inputs.wadm-manifest-path }}..."
            wash app validate "${{ inputs.wadm-manifest-path }}"
          fi

      - name: Sync Fresh ECR Token to Secrets Manager (Zero GHCR Policy, ADR-0042, ADR-0045)
        if: contains(inputs.oci-registry, 'amazonaws.com')
        run: |
          echo "Syncing fresh ECR authorization token for wasmcloud-host..."
          ECR_PASS=$(aws ecr get-login-password --region "${{ inputs.aws-region }}")
          aws secretsmanager put-secret-value \
            --secret-id "wasmcloud/ecr/token" \
            --secret-string "${ECR_PASS}" \
            --region "${{ inputs.aws-region }}"

      - name: Deploy to Staging wasmCloud Lattice (Remote in-VPC ECS Task)
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          LATTICE: ${{ inputs.staging-lattice }}
          CLUSTER: ${{ inputs.ecs-cluster }}
          TASK_DEF: ${{ inputs.ecs-task-definition }}
          SUBNETS: ${{ inputs.ecs-subnets }}
          SECURITY_GROUPS: ${{ inputs.ecs-security-groups }}
          ASSIGN_PUBLIC_IP: ${{ inputs.ecs-assign-public-ip }}
          INPUT_CTL_HOST: ${{ secrets.WASMCLOUD_CTL_HOST }}
          INPUT_CTL_PORT: ${{ secrets.WASMCLOUD_CTL_PORT }}
          INPUT_NATS_HOST: ${{ inputs.nats-host }}
          INPUT_NATS_PORT: ${{ inputs.nats-port }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail

          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: Manifest file '${MANIFEST}' not found. Cannot deploy to lattice."
            exit 1
          fi

          CTL_HOST="${INPUT_CTL_HOST:-${INPUT_NATS_HOST:-nats.wasmcloud.local}}"
          CTL_PORT="${INPUT_CTL_PORT:-${INPUT_NATS_PORT:-4222}}"
          TARGET_LATTICE="${LATTICE:-default}"

          echo "=== wasmCloud Remote in-VPC Deployment ==="
          echo "Target Manifest: ${MANIFEST}"
          echo "Target Lattice:  ${TARGET_LATTICE}"
          echo "NATS Control:    ${CTL_HOST}:${CTL_PORT}"
          echo "ECS Cluster:     ${CLUSTER}"
          echo "Task Definition: ${TASK_DEF}"
          echo "Subnets:         ${SUBNETS}"
          echo "Security Groups: ${SECURITY_GROUPS}"
          echo "Public IP:       ${ASSIGN_PUBLIC_IP}"

          # Compress manifest to base64 to ensure it stays well within ECS overrides character limit
          MANIFEST_GZ_B64=$(gzip -c "${MANIFEST}" | base64 -w 0)

          # Dynamically determine the container name from the task definition
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF}" \
            --region "${AWS_REGION}" \
            --query "taskDefinition.containerDefinitions[0].name" \
            --output text)

          if [ -z "${CONTAINER_NAME}" ] || [ "${CONTAINER_NAME}" = "None" ]; then
            echo "ERROR: Could not resolve container name from task definition '${TASK_DEF}'."
            exit 1
          fi
          echo "Target Container Name: ${CONTAINER_NAME}"

          # Build container overrides JSON
          CONTAINER_SCRIPT="set -euo pipefail; echo '=== In-VPC Ephemeral Deployer Started ==='; echo 'Decoding and decompressing manifest...'; echo \"\$MANIFEST_GZ_B64\" | base64 -d | gunzip > /tmp/wadm.yaml; echo 'Verifying wash CLI availability...'; if ! command -v wash >/dev/null 2>&1; then echo 'Installing curl, ca-certificates, and wash binary...'; apk add --no-cache curl ca-certificates >/dev/null 2>&1 || true; curl -fsSL 'https://github.com/wasmCloud/wasmCloud/releases/download/wash-v0.43.0/wash-aarch64-unknown-linux-musl' -o /usr/local/bin/wash; chmod +x /usr/local/bin/wash; fi; echo 'Executing wash app deploy...'; wash app deploy /tmp/wadm.yaml --ctl-host \"${CTL_HOST}\" --ctl-port \"${CTL_PORT}\" --lattice \"${TARGET_LATTICE}\" --replace; echo '=== WADM Application Deployment Successfully Executed ==='"

          OVERRIDES_FILE=$(mktemp)
          python3 -c 'import json, sys; overrides = {"containerOverrides": [{"name": sys.argv[1], "environment": [{"name": "MANIFEST_GZ_B64", "value": sys.argv[2]}], "command": ["sh", "-c", sys.argv[3]]}]}; json.dump(overrides, open(sys.argv[4], "w"))' "${CONTAINER_NAME}" "${MANIFEST_GZ_B64}" "${CONTAINER_SCRIPT}" "${OVERRIDES_FILE}"

          NET_CONFIG=$(python3 -c 'import json, sys; subnets = json.dumps([s.strip() for s in sys.argv[1].split(",") if s.strip()]); sgs = json.dumps([s.strip() for s in sys.argv[2].split(",") if s.strip()]); pip = sys.argv[3].strip(); print(f"awsvpcConfiguration={{subnets={subnets},securityGroups={sgs},assignPublicIp={pip}}}")' "${SUBNETS}" "${SECURITY_GROUPS}" "${ASSIGN_PUBLIC_IP}")

          echo "Launching ephemeral ECS Fargate deployment task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEF}" \
            --launch-type FARGATE \
            --network-configuration "${NET_CONFIG}" \
            --overrides "file://${OVERRIDES_FILE}" \
            --region "${AWS_REGION}" \
            --query "tasks[0].taskArn" \
            --output text)

          rm -f "${OVERRIDES_FILE}"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ERROR: Failed to launch ephemeral ECS deployment task. No task ARN returned."
            exit 1
          fi

          echo "Launched ephemeral ECS task: ${TASK_ARN}"
          TASK_ID=$(echo "${TASK_ARN}" | awk -F'/' '{print $NF}')

          echo "Waiting for ephemeral deployment task (${TASK_ID}) to stop..."
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}"

          echo "Task stopped. Inspecting task completion status..."
          DESC=$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}")

          EXIT_CODE=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].exitCode')
          STOP_REASON=$(echo "${DESC}" | jq -r '.tasks[0].stoppedReason // empty')
          CONTAINER_REASON=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].reason // empty')

          echo "Task stopped reason: ${STOP_REASON:-None}"
          echo "Container exit code: ${EXIT_CODE}"
          if [ -n "${CONTAINER_REASON}" ]; then
            echo "Container reason: ${CONTAINER_REASON}"
          fi

          # Fail closed if exit code is non-zero or empty
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "ERROR: Ephemeral deployment container exited with non-zero code: ${EXIT_CODE}"
            echo "=== Fetching CloudWatch logs for task ${TASK_ID} ==="
            LOG_GROUP="/ecs/cloudflared"
            LOG_STREAM="deployer/${CONTAINER_NAME}/${TASK_ID}"
            aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${LOG_STREAM}" \
              --region "${AWS_REGION}" \
              --query "events[*].message" \
              --output text || echo "Warning: Could not retrieve CloudWatch logs for ${LOG_STREAM}"
            exit 1
          fi

          echo "Ephemeral ECS deployment task completed successfully (exit code 0)."

      - name: Staging Availability Smoke Test
        id: smoke
        env:
          HEALTH_URL: ${{ inputs.health-endpoint-staging || inputs.health-check-endpoint }}
        run: |
          if [ -n "${HEALTH_URL}" ]; then
            echo "Verifying staging service health at ${HEALTH_URL}..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "${HEALTH_URL}" > /dev/null 2>&1; then
                echo "Staging service healthy after ${i} retries."
                SUCCESS=1
                break
              fi
              sleep 5
            done
            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Staging service failed health check at ${HEALTH_URL} within timeout."
              exit 1
            fi
            echo "url=${HEALTH_URL}" >> "${GITHUB_OUTPUT}"
          else
            echo "url=" >> "${GITHUB_OUTPUT}"
          fi

  # =========================================================================
  # 5. Deploy to Production Environment (Gated via Manual Approval)
  # Strictly sequenced after staging (needs: [deploy-staging]).
  # Gated by GitHub Actions Environment protection rules on 'production'.
  # =========================================================================
  deploy-production:
    name: Deploy to Production (Manual Gate)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy-production
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: deploy-production-main
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          audience: sts.amazonaws.com

      - name: Install wash CLI
        run: |
          echo "Installing wasmCloud wash CLI (${{ inputs.wash-version }})..."
          if ! command -v wash &> /dev/null; then
            WASH_VER="${{ inputs.wash-version }}"
            if sudo curl -fsSL "https://github.com/wasmCloud/wasmCloud/releases/download/${WASH_VER}/wash-x86_64-unknown-linux-musl" -o /usr/local/bin/wash; then
              sudo chmod +x /usr/local/bin/wash
            else
              echo "Fallback: installing via packagecloud..."
              curl -s https://packagecloud.io/install/repositories/wasmcloud/core/script.deb.sh | sudo bash || true
              sudo apt-get install -y wash || true
            fi
          fi
          wash --version

      - name: Interpolate WADM Application Manifest
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          TAG: sha-${{ github.sha }}
          REGISTRY: ${{ inputs.oci-registry }}
          PREFIX: ${{ inputs.oci-repository-prefix }}
        run: |
          echo "Interpolating production WADM manifest ${MANIFEST} with tag ${TAG}..."
          if [ -f "${MANIFEST}" ]; then
            sed -i "s|{{IMAGE_TAG}}|${TAG}|g" "${MANIFEST}"
            if [ -n "${PREFIX}" ]; then
              sed -i "s|{{REGISTRY}}|${REGISTRY}/${PREFIX}|g" "${MANIFEST}"
            else
              sed -i "s|{{REGISTRY}}|${REGISTRY}|g" "${MANIFEST}"
            fi
          else
            echo "WADM manifest ${MANIFEST} not found, skipping templating."
          fi

      - name: Validate WADM Application Manifest
        run: |
          if [ -f "${{ inputs.wadm-manifest-path }}" ]; then
            echo "Validating WADM application manifest ${{ inputs.wadm-manifest-path }}..."
            wash app validate "${{ inputs.wadm-manifest-path }}"
          fi

      - name: Sync Fresh ECR Token to Secrets Manager (Zero GHCR Policy, ADR-0042, ADR-0045)
        if: contains(inputs.oci-registry, 'amazonaws.com')
        run: |
          echo "Syncing fresh ECR authorization token for wasmcloud-host..."
          ECR_PASS=$(aws ecr get-login-password --region "${{ inputs.aws-region }}")
          aws secretsmanager put-secret-value \
            --secret-id "wasmcloud/ecr/token" \
            --secret-string "${ECR_PASS}" \
            --region "${{ inputs.aws-region }}"

      - name: Deploy to Production wasmCloud Lattice (Remote in-VPC ECS Task)
        env:
          MANIFEST: ${{ inputs.wadm-manifest-path }}
          LATTICE: ${{ inputs.production-lattice }}
          CLUSTER: ${{ inputs.ecs-cluster }}
          TASK_DEF: ${{ inputs.ecs-task-definition }}
          SUBNETS: ${{ inputs.ecs-subnets }}
          SECURITY_GROUPS: ${{ inputs.ecs-security-groups }}
          ASSIGN_PUBLIC_IP: ${{ inputs.ecs-assign-public-ip }}
          INPUT_CTL_HOST: ${{ secrets.WASMCLOUD_CTL_HOST }}
          INPUT_CTL_PORT: ${{ secrets.WASMCLOUD_CTL_PORT }}
          INPUT_NATS_HOST: ${{ inputs.nats-host }}
          INPUT_NATS_PORT: ${{ inputs.nats-port }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail

          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: Manifest file '${MANIFEST}' not found. Cannot deploy to lattice."
            exit 1
          fi

          CTL_HOST="${INPUT_CTL_HOST:-${INPUT_NATS_HOST:-nats.wasmcloud.local}}"
          CTL_PORT="${INPUT_CTL_PORT:-${INPUT_NATS_PORT:-4222}}"
          TARGET_LATTICE="${LATTICE:-default}"

          echo "=== wasmCloud Remote in-VPC Deployment ==="
          echo "Target Manifest: ${MANIFEST}"
          echo "Target Lattice:  ${TARGET_LATTICE}"
          echo "NATS Control:    ${CTL_HOST}:${CTL_PORT}"
          echo "ECS Cluster:     ${CLUSTER}"
          echo "Task Definition: ${TASK_DEF}"
          echo "Subnets:         ${SUBNETS}"
          echo "Security Groups: ${SECURITY_GROUPS}"
          echo "Public IP:       ${ASSIGN_PUBLIC_IP}"

          # Compress manifest to base64 to ensure it stays well within ECS overrides character limit
          MANIFEST_GZ_B64=$(gzip -c "${MANIFEST}" | base64 -w 0)

          # Dynamically determine the container name from the task definition
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF}" \
            --region "${AWS_REGION}" \
            --query "taskDefinition.containerDefinitions[0].name" \
            --output text)

          if [ -z "${CONTAINER_NAME}" ] || [ "${CONTAINER_NAME}" = "None" ]; then
            echo "ERROR: Could not resolve container name from task definition '${TASK_DEF}'."
            exit 1
          fi
          echo "Target Container Name: ${CONTAINER_NAME}"

          # Build container overrides JSON
          CONTAINER_SCRIPT="set -euo pipefail; echo '=== In-VPC Ephemeral Deployer Started ==='; echo 'Decoding and decompressing manifest...'; echo \"\$MANIFEST_GZ_B64\" | base64 -d | gunzip > /tmp/wadm.yaml; echo 'Verifying wash CLI availability...'; if ! command -v wash >/dev/null 2>&1; then echo 'Installing curl, ca-certificates, and wash binary...'; apk add --no-cache curl ca-certificates >/dev/null 2>&1 || true; curl -fsSL 'https://github.com/wasmCloud/wasmCloud/releases/download/wash-v0.43.0/wash-aarch64-unknown-linux-musl' -o /usr/local/bin/wash; chmod +x /usr/local/bin/wash; fi; echo 'Executing wash app deploy...'; wash app deploy /tmp/wadm.yaml --ctl-host \"${CTL_HOST}\" --ctl-port \"${CTL_PORT}\" --lattice \"${TARGET_LATTICE}\" --replace; echo '=== WADM Application Deployment Successfully Executed ==='"

          OVERRIDES_FILE=$(mktemp)
          python3 -c 'import json, sys; overrides = {"containerOverrides": [{"name": sys.argv[1], "environment": [{"name": "MANIFEST_GZ_B64", "value": sys.argv[2]}], "command": ["sh", "-c", sys.argv[3]]}]}; json.dump(overrides, open(sys.argv[4], "w"))' "${CONTAINER_NAME}" "${MANIFEST_GZ_B64}" "${CONTAINER_SCRIPT}" "${OVERRIDES_FILE}"

          NET_CONFIG=$(python3 -c 'import json, sys; subnets = json.dumps([s.strip() for s in sys.argv[1].split(",") if s.strip()]); sgs = json.dumps([s.strip() for s in sys.argv[2].split(",") if s.strip()]); pip = sys.argv[3].strip(); print(f"awsvpcConfiguration={{subnets={subnets},securityGroups={sgs},assignPublicIp={pip}}}")' "${SUBNETS}" "${SECURITY_GROUPS}" "${ASSIGN_PUBLIC_IP}")

          echo "Launching ephemeral ECS Fargate deployment task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEF}" \
            --launch-type FARGATE \
            --network-configuration "${NET_CONFIG}" \
            --overrides "file://${OVERRIDES_FILE}" \
            --region "${AWS_REGION}" \
            --query "tasks[0].taskArn" \
            --output text)

          rm -f "${OVERRIDES_FILE}"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ERROR: Failed to launch ephemeral ECS deployment task. No task ARN returned."
            exit 1
          fi

          echo "Launched ephemeral ECS task: ${TASK_ARN}"
          TASK_ID=$(echo "${TASK_ARN}" | awk -F'/' '{print $NF}')

          echo "Waiting for ephemeral deployment task (${TASK_ID}) to stop..."
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}"

          echo "Task stopped. Inspecting task completion status..."
          DESC=$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}")

          EXIT_CODE=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].exitCode')
          STOP_REASON=$(echo "${DESC}" | jq -r '.tasks[0].stoppedReason // empty')
          CONTAINER_REASON=$(echo "${DESC}" | jq -r '.tasks[0].containers[0].reason // empty')

          echo "Task stopped reason: ${STOP_REASON:-None}"
          echo "Container exit code: ${EXIT_CODE}"
          if [ -n "${CONTAINER_REASON}" ]; then
            echo "Container reason: ${CONTAINER_REASON}"
          fi

          # Fail closed if exit code is non-zero or empty
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "ERROR: Ephemeral deployment container exited with non-zero code: ${EXIT_CODE}"
            echo "=== Fetching CloudWatch logs for task ${TASK_ID} ==="
            LOG_GROUP="/ecs/cloudflared"
            LOG_STREAM="deployer/${CONTAINER_NAME}/${TASK_ID}"
            aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${LOG_STREAM}" \
              --region "${AWS_REGION}" \
              --query "events[*].message" \
              --output text || echo "Warning: Could not retrieve CloudWatch logs for ${LOG_STREAM}"
            exit 1
          fi

          echo "Ephemeral ECS deployment task completed successfully (exit code 0)."

      - name: Production Availability Smoke Test
        id: smoke
        env:
          HEALTH_URL: ${{ inputs.health-endpoint-production || inputs.health-check-endpoint }}
        run: |
          if [ -n "${HEALTH_URL}" ]; then
            echo "Verifying production service health at ${HEALTH_URL}..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "${HEALTH_URL}" > /dev/null 2>&1; then
                echo "Production service healthy after ${i} retries."
                SUCCESS=1
                break
              fi
              sleep 5
            done
            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Production service failed health check at ${HEALTH_URL}."
              exit 1
            fi
            echo "url=${HEALTH_URL}" >> "${GITHUB_OUTPUT}"
          else
            echo "url=" >> "${GITHUB_OUTPUT}"
          fi
